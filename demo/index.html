  <body>
    <main id="demo">
      <noscript>
        <h1>Ramdac</h1>
        <p>
          An FFGL effect that forces your clip into 16 colours or fewer, the way
          an 8-bit machine's screen would have shown it: the Commodore 64, the
          ZX Spectrum, the NES, the Game Boy, CGA, the Amstrad CPC, PICO-8,
          teletext or the Amiga's Workbench, a palette you type, or one chosen
          from the clip. The picture becomes a grid of colour numbers and a
          small colour table, as it was on the hardware, so a palette swap, a
          fade and Deluxe Paint's colour cycling are writes to the table while
          the picture underneath stays exactly where it was.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/ramdac">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/ramdac/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/ramdac">Source on GitHub</a></li>
        </ul>
      </noscript>
