    <title>Ramdac — browser demo | Stoatworks Labs</title>
    <meta name="description" content="Try the Ramdac FFGL effect for Resolume in your browser: indexed colour from whatever clip you put through it — the 4, 8 or 16 colours of the C64, CGA, Spectrum, CPC, NES, Game Boy, PICO-8, teletext or the Amiga's Workbench, a palette you type, or one chosen from the clip — then palette swaps, fades and Deluxe Paint colour cycling. The plugin's own GLSL, ported to WebGL2 unedited, fed by a JavaScript port of its CPU half. A demo, not the plugin." />
    <link rel="icon" href="data:," />

    <main id="demo">
      <noscript>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/ramdac">its repository</a>.
        </p>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>

    ></script>
